.srow{display:flex;align-items:center;gap:14px;width:100%;min-height:72px;padding:12px 14px;margin:0 0 10px;border:0;border-radius:14px;background:color-mix(in srgb,var(--c) 13%,var(--card));box-shadow:none;text-align:left}
.srow:active{transform:translateY(1px);box-shadow:none}
.sic{width:48px;height:48px;flex:none;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 color-mix(in srgb,var(--c) 72%,#000)}
.sic svg{width:26px;height:26px}
.stx b{display:block;font-size:17px;font-weight:900;color:var(--tx);line-height:1.25}.stx span{display:block;font-size:13px;font-weight:700;color:var(--mu)}
.ssy{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px;min-height:50px;padding:8px 14px;margin:0 0 10px;border-radius:14px;background:color-mix(in srgb,var(--mu) 9%,var(--card));font-size:14px;font-weight:700;color:var(--mu);text-align:center}
.ssy a{font-weight:800}
.sver{display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0 0;font-size:13px;font-weight:700;color:var(--mu)}
.sdeco{position:absolute;left:0;right:0;bottom:0;width:100%;height:66px;display:block}
/* GAMES */
.gwrap{display:flex;flex-direction:column;gap:12px;margin-top:2px}
.gsec h2{display:flex;align-items:center;gap:10px;margin:0 0 8px;height:28px;font-size:17px;font-weight:900;letter-spacing:.5px;color:var(--tx)}
.gsec h2 svg{width:40px;height:30px;flex:none}
.g6{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.gmt{grid-column:span 2;height:72px;margin:0;padding:4px;border:0;border-radius:12px;background:color-mix(in srgb,var(--c) 14%,var(--card));box-shadow:0 3px 0 color-mix(in srgb,var(--c) 28%,var(--card));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--tx)}
.gmt:active{transform:translateY(2px);box-shadow:0 1px 0 color-mix(in srgb,var(--c) 28%,var(--card))}
.gmt .gi{display:block;width:38px;height:38px;flex:none}.gmt .gi svg{width:100%;height:100%;display:block}
.gmt .gl{font-size:12px;line-height:14px;font-weight:900;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.gmt.gwd{grid-column:span 3;height:58px;flex-direction:row;justify-content:flex-start;gap:10px;padding:6px 12px;text-align:left}
.gmt.gwd .gi{width:40px;height:40px}.gmt.gwd .gl{font-size:14px;line-height:16px;white-space:normal}
@media(min-width:520px){.gmt{height:88px}.gmt .gi{width:46px;height:46px}.gmt .gl{font-size:13px}}
/* Journey */
.jwrap{padding-top:4px}
.juh{display:flex;align-items:center;gap:14px;width:100%;min-height:88px;margin:4px 0 6px;padding:14px 18px;border:0;border-radius:14px;background:#77B6FF;box-shadow:0 5px 0 #13579F;color:#fff;text-align:left}
.juh:active{transform:translateY(2px);box-shadow:0 3px 0 #13579F}
.juh.done{background:#2BB57F;box-shadow:0 5px 0 #1F9467}.juh.lock{background:#A3B0C6;box-shadow:0 5px 0 #7F8DA8}
.juh-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.juh-t>b{font-size:26px;line-height:28px;font-weight:900}
.juh-n{font-size:14px;font-weight:800;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.juh-p{display:flex;align-items:center;gap:10px;font-size:14px}.juh-p b{font-weight:900}
.juh-b{flex:1;height:12px;border-radius:6px;background:rgba(19,87,159,.45);overflow:hidden}.juh-b i{display:block;height:100%;border-radius:6px;background:#BDEED9}
.juh-d{width:60px;height:60px;flex:none;border-radius:14px;background:#FFFDF8;display:flex;align-items:center;justify-content:center}.juh-d svg{width:40px;height:44px}
.jdiv{display:flex;align-items:center;gap:12px;width:100%;margin:14px 0;padding:0;border:0;background:none;box-shadow:none}
.jdiv:active{transform:none;box-shadow:none}
.jdl{flex:1;height:3px;border-radius:2px;background:var(--bd)}
.jdp{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:12px;background:var(--card);border:2px solid var(--bd);font-size:14px;font-weight:900;color:var(--mu)}
.jdp svg{width:15px;height:15px}.jdiv.done .jdp{background:color-mix(in srgb,#2BB57F 14%,var(--card));color:#1F9467;border-color:color-mix(in srgb,#2BB57F 35%,var(--card))}
.jp2{position:relative;width:320px;max-width:100%;margin:0 auto}
.jline{position:absolute;left:0;top:0;pointer-events:none}
.jnd{position:absolute;margin:0;padding:0;border:0;border-radius:50%;display:flex;align-items:center;justify-content:center;z-index:2}
.jnd:active{transform:translateY(3px)}
.jnd.tr{border-radius:22px}.jnd.tt{border-radius:22px;transform:rotate(45deg)}.jnd.tt:active{transform:rotate(45deg) translateY(2px)}
.jnd.tt .nin{transform:rotate(-45deg)}
.jnd .nin{display:block;width:52%;height:52%}.jnd .nin svg{width:100%;height:100%;display:block}
.jnd.lk{opacity:1;cursor:default}.jnd:disabled{opacity:1}
.nbd{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;box-sizing:border-box}
.nbd svg{width:14px;height:14px}.nbd.ok{background:#BDEED9}.nbd.lk{background:#7F8DA8}
.jnd.tt .nbd{right:auto;bottom:-14px;left:50%;transform:translateX(-50%) rotate(-45deg)}
.npl{position:absolute;width:92px;height:92px;border-radius:50%;opacity:.5;z-index:1;animation:jpulse 1.8s ease-out infinite;pointer-events:none}
.nhalo{position:absolute;width:100px;height:100px;border-radius:50%;background:color-mix(in srgb,#FF454D 18%,var(--bg));z-index:1;pointer-events:none}
.jbear{position:absolute;width:88px;z-index:3;display:flex;flex-direction:column;align-items:center;animation:jbob 2.2s ease-in-out infinite;pointer-events:none}
.jbear svg{display:block}
.jsay{position:relative;margin-bottom:2px;padding:5px 12px;border-radius:12px;background:#192F60;color:#fff;font-size:14px;font-weight:900;white-space:nowrap}
.jsay:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:#192F60}
.jrs{pointer-events:auto;margin:2px 0 0;padding:4px 10px;font-size:12px;border-radius:10px;box-shadow:none}
.jfox{position:absolute;z-index:1;pointer-events:none}
@keyframes jpulse{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.35);opacity:0}}
@keyframes jbob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){.npl,.jbear{animation:none}}
/* ===== ver_54 Journey map ===== */
.jmap{position:relative;margin:-16px 0 0;overflow:hidden;color:#192F60;border-radius:0 0 18px 18px}
.jmbg{position:absolute;left:0;top:0;display:block;pointer-events:none}
.jmtop{position:absolute;left:16px;right:16px;top:14px;z-index:4;display:flex;align-items:center;justify-content:space-between;gap:10px}
.jmtop>div{display:flex;flex-direction:column;padding:8px 14px;border-radius:16px;background:rgba(255,253,248,.88);box-shadow:0 4px 14px rgba(25,47,96,.08)}
.jmtop b{font-size:22px;line-height:24px;font-weight:900;color:#192F60}.jmtop span{font-size:13px;font-weight:800;color:#4A6595}
.jmpill{background:rgba(255,253,248,.9)!important;color:#FF454D!important;box-shadow:0 4px 14px rgba(25,47,96,.08)}
.jmu{position:absolute;z-index:3;transform:translate(-50%,-50%);display:flex;align-items:center;gap:10px;min-width:200px;max-width:78%;padding:8px 14px 8px 8px;border-radius:18px;background:#FFFDF8;box-shadow:0 5px 0 #D6E2F0,0 8px 18px rgba(25,47,96,.10)}
.jmu-b{flex:none;width:40px;height:40px;border-radius:12px;background:#238CF4;color:#fff;font-weight:900;font-size:18px;display:flex;align-items:center;justify-content:center}
.jmu-b svg{width:22px;height:22px}.jmu.done .jmu-b{background:#2BB57F}.jmu.lock .jmu-b{background:#A3B0C6}
.jmu-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.15}.jmu-t b{font-size:16px;font-weight:900;color:#192F60}
.jmu-t span{font-size:13px;font-weight:800;color:#4A6595;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jmu-p{flex:none;font-size:13px;font-weight:900;color:#238CF4;background:#E4F1FF;border-radius:10px;padding:3px 8px}
.jmu.done .jmu-p{color:#1F9467;background:#D7F8EA}.jmu.lock .jmu-p{color:#7F8DA8;background:#EEF2F7}
.jmap .nbd{border-color:#FFFDF8}.jmap .jsay{box-shadow:0 3px 8px rgba(25,47,96,.2)}
.jmap .jrs{background:#FFFDF8;color:#192F60;border:2px solid #D6E2F0}
.jmap .nhalo{background:rgba(255,69,77,.14)}
/* ===== ver_58: one-screen layouts (no scrolling) ===== */
main:has(>.hb),main:has(.endb){height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:0;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}
main:has(>.hb){padding-bottom:0}main:has(>.hb)::after{content:"";flex:none;height:94px}

.gwrap{gap:8px}.gsec h2{margin:0 0 6px;height:24px;font-size:16px}.gsec h2 svg{width:34px;height:26px}.g6{gap:7px}
.gmt{height:64px}.gmt .gi{width:34px;height:34px}.gmt.gwd{height:50px}.gmt.gwd .gi{width:34px;height:34px}

.spanel{padding:12px 14px 50px}.srow{min-height:62px;padding:9px 12px;margin-bottom:8px}.sic{width:42px;height:42px}.sic svg{width:23px;height:23px}
.ssy{min-height:42px;padding:6px 12px;margin-bottom:8px}.sdeco{height:48px}
main:has(.endb){min-height:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
main:has(.endb)>h1{flex:none;margin:2px 0 6px}

main:has(.endb) .jw>div{min-width:0}main:has(.endb) .jw>div>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main:has(.endb) .jw>div>div:first-child{font-size:16px!important}main:has(.endb) .jw>div>div.mu{font-size:13px!important}
main:has(.endb) .big{font-size:30px}
/* sentence translation: 10% smaller text */
.sbq .chip{font-size:17px;padding:7px 11px}.gt.tight{font-size:13.5px}.gt.tight td,.gt.tight th{padding:5px 3px}
main:has(.endb)>.mas{min-height:min(170px,22vh)}main:has(.endb)>.card>div[style*="text-align:left"]{display:grid;grid-template-columns:1fr 1fr;column-gap:12px}.sbq .sbt{font-size:21.5px!important}

/* ===== ver_61: locked page (no pull-to-scroll) + centred Setting / GAMES ===== */
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);width:100%;height:auto;min-height:0!important}
:root{padding-top:0!important;padding-bottom:0!important}
main#app{height:100%!important;min-height:0;overflow-x:hidden;overflow-y:auto;overscroll-behavior:none;-webkit-overflow-scrolling:touch;touch-action:pan-y;box-sizing:border-box}
/* Home fits one screen: the hero shrinks first */
main:has(>.hero){display:flex;flex-direction:column;overflow-y:auto}
main:has(>.hero)>*{flex:none}
main:has(>.hero)>.hero{flex:1 1 0;min-height:70px;height:0;width:100%;max-width:360px;object-fit:contain;margin:0 auto 4px}
/* GAMES: everything centred, all tiles share one layout */
.gsec h2{justify-content:center}
.g6{justify-items:stretch}
.gmt,.gmt.gwd{flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:2px;padding:4px;height:64px}
.gmt .gi,.gmt.gwd .gi{width:34px;height:34px}
.gmt .gl,.gmt.gwd .gl{font-size:12px;line-height:14px;white-space:nowrap;text-align:center}
/* Setting: rows centred */
.spanel{margin:-18px 0 0}
.srow{justify-content:center;gap:14px}
.stx{text-align:left}

/* ===== ver_61: hero full width, plain Setting buttons, left-aligned GAMES headings ===== */
main:has(>.hb)>.hb{aspect-ratio:auto;width:calc(100% + 32px);max-width:none;align-self:center;height:min(300px,75.1vw);flex:0 1 auto;min-height:72px}
main:has(>.hb)>.hb>svg{position:absolute;left:0;top:0;width:100%;height:100%;max-width:none;margin:0}
.spanel{margin:0;padding:26px 0 0;background:none;box-shadow:none;border-radius:0;overflow:visible}
.sdeco{display:none}
.gsec h2{justify-content:flex-start;padding-left:2px}

/* ===== ver_62: Setting rows left aligned, 4 rows, Font Setting ===== */
.srow{justify-content:flex-start;gap:14px;min-height:56px;padding:7px 12px 7px 26px;margin-bottom:8px}
.sic{width:38px;height:38px;flex:none}.sic svg{width:21px;height:21px}

.fopt{display:flex;align-items:center;gap:10px;padding:12px;margin:8px 0;border:2px solid var(--bd);border-radius:14px;background:var(--card);cursor:pointer}
.fopt.on{border-color:var(--pr);background:color-mix(in srgb,var(--pr) 10%,var(--card))}

html{background:var(--bg)}
body{top:0!important;bottom:0!important;left:0!important;right:0!important;height:auto!important}
main#app{padding-top:calc(16px + env(safe-area-inset-top,0px))}

main#app:has(.jmap){padding-bottom:0}

function applyIll(){let n=0;const t=Date.now();S.cards.forEach(c=>{const s2=ILL192[ik(c.ru)];if(s2&&!c.l192&&c.iv!==99){c.img=s2;c.iv=ILLV;c.l192=1;c.u=t;n++;return}if((c.iv||0)<ILLV){const s=illFor(c);if(s){c.img=s;c.iv=ILLV;c.u=t;n++}}});if(n)save();return n}
const STYLE=`Style: cute, clean, modern 2D flat cartoon illustration for a premium language-learning app. Draw it detailed enough that the meaning is clear at a glance: add 2-4 small characteristic details (windows, signs, props, emblems, tiny decorations) and make it charming and friendly. Rounded shapes, bold readable silhouettes, no gradients, no shadows, no text or letters. Canvas: viewBox="0 0 192 192" with no width or height attributes. Draw NO background at all: no background rectangle, no sky, no backdrop panel or circle; everything outside the subject stays transparent. No padding: the subject fills the canvas almost edge to edge, keeping only about 4 units free at the edges so outlines are not clipped. Outlines: put stroke="#123B82" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round" on the root svg so every shape gets a dark navy outline; use thinner navy lines (1.6-2.4) for small inner details and white lines (#FFFFFF) for markings on coloured areas. Palette only: blue #2589FF, red #FF465C, yellow #FFD166, mint #66E7B7, lavender #C9B6FF, pink #FFB3C1, light blue glass #BFE0FF, pale sky #EAF5FF, cream #FFF9ED, white #FFFFFF, grey-blue #9FB3D6, wood #A86A35; skin tones #FAD7BD #EDB98F #C68A5E #8F5E3F. People are cute busts: round head circle r=33 at (96,88), body path "M40 188q0-58 56-58t56 58z", small navy dot eyes at (84,90) and (108,90), soft pink cheeks (#FF8A9B, opacity .55), tiny smile, simple hair, plus one instantly recognisable prop. Buildings and places are drawn from the front, standing on a thin base or steps strip at the bottom, with an emblem or sign symbol that shows what kind of place it is.`;

const thumb=(c,z)=>`<span style="flex:none;display:block;width:${z}px;height:${z}px">${imgHtml(c,z)}</span>`;
const NOBG=new Map();
function noBg(s){s=String(s);if(NOBG.has(s))return NOBG.get(s);const vb=s.match(/viewBox="\s*[-\d.]+[\s,]+[-\d.]+[\s,]+([\d.]+)[\s,]+([\d.]+)\s*"/),W=vb?+vb[1]:100,H=vb?+vb[2]:100;
  const big=(v,M)=>v!=null&&(/^100%$/.test(v)||parseFloat(v)>=M*.9);let first=true;
  const out=s.replace(/<rect\b[^>]*?(?:\/>|>\s*<\/rect>)/gi,m=>{const a=n=>{const r=m.match(new RegExp('\\s'+n+'="([^"]*)"'));return r?r[1]:null};
    const hit=big(a('width'),W)&&big(a('height'),H)&&(parseFloat(a('x')||0)<=W*.06)&&(parseFloat(a('y')||0)<=H*.06);if(hit&&first)return '';first=false;return m});
  NOBG.set(s,out);return out}
const imgHtml=(c,s)=>c&&c.img?(c.img.startsWith('data:')?`<img class="il ph" alt="" width="${s}" height="${s}" style="object-fit:cover" src="${c.img}">`:`<img class="il" alt="" width="${s}" height="${s}" src="${'data:image/svg+xml;utf8,'+encodeURIComponent(noBg(c.img))}">`):'';
async function genImgs(){
  const m=document.getElementById('gm'),b=document.getElementById('gb');
  let sample=null;try{sample=await claude.use('sample')}catch(e){}
  if(!sample){m.textContent='Image generation is not available in this view.';return}
  const lib=applyIll();const todo=S.cards.filter(c=>!c.img||((c.iv||0)<ILLV));b.disabled=true;let done=0;if(!todo.length){m.textContent=lib?`Done! ${lib} pictures updated from the MemoRise library.`:'All words have pictures.';setTimeout(vocab,1200);return}
  try{for(let i=0;i<todo.length;i+=3){
    const bt=todo.slice(i,i+3);m.textContent=`Drawing… ${done}/${todo.length}`;
    const items=bt.map((c,k)=>({i:k,en:c.en,ru:c.ru}));
    const r=await sample.json(`For each word below, draw one illustration as SVG (viewBox="0 0 192 192", no scripts, no external references, under 7000 characters each) that clearly conveys its meaning. ${STYLE} If the word is abstract, depict a simple symbol or tiny scene. Return ONLY a JSON array like [{"i":0,"svg":"<svg ...>...</svg>"}]. Words: ${JSON.stringify(items)}`,{cache:false});
    const arr=Array.isArray(r)?r:(r&&r.items)||[];
    arr.forEach(o=>{let v=o&&o.svg,c=bt[o&&o.i];
      if(c&&typeof v=='string'&&/^\s*<svg/i.test(v)&&!/<script|\son\w+=|href|<image|foreignObject/i.test(v)){
        if(!/xmlns=/.test(v))v=v.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"');c.img=v.trim();c.iv=ILLV;c.u=Date.now();done++}});
    save()}
    m.textContent=`Done! Created ${done} images.`}
  catch(e){m.textContent=(e&&e.code=='rate_limited'?'Rate limited, please try again in a few minutes. ':e&&e.code=='not_granted'?'Permission was declined. ':'Something went wrong. ')+`Created ${done} images.`}
  setTimeout(vocab,1200)}

function libImg(i){const c=S.cards[i],s=illFor(c);if(!s)return;c.img=s;c.iv=ILLV;c.u=Date.now();save();vocab();editImg(i)}
function rmImg(i){delete S.cards[i].img;S.cards[i].iv=99;S.cards[i].u=Date.now();save();vocab();editImg(i)}
function upImg(i,inp){const f=inp.files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const z=200,cv=document.createElement('canvas');cv.width=cv.height=z;const m=Math.min(im.width,im.height),x=cv.getContext('2d');
    x.fillStyle='#fff';x.fillRect(0,0,z,z);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);URL.revokeObjectURL(u);
    S.cards[i].img=cv.toDataURL('image/jpeg',.82);S.cards[i].iv=99;S.cards[i].u=Date.now();save();vocab();editImg(i)};
  im.onerror=()=>{document.getElementById('em').textContent='Could not read this image.'};im.src=u}
async function regen(i){const c=S.cards[i],m=document.getElementById('em'),hint=document.getElementById('ep').value.trim();
  let sample=null;try{sample=await claude.use('sample')}catch(e){}
  if(!sample){m.textContent='Image drawing is not available in this view.';return}
  m.textContent='Drawing…';
  try{const r=await sample.json(`Draw one illustration as SVG (viewBox="0 0 192 192", no scripts, no external references, under 7000 characters) for the word "${c.en}" (Russian: "${c.ru}").${hint?' Extra instructions from the learner: '+hint+'.':''} ${STYLE} Return ONLY JSON: {"svg":"<svg ...>...</svg>"}`,{cache:false});
    let v=r&&r.svg;if(typeof v=='string'&&/^\s*<svg/i.test(v)&&!/<script|\son\w+=|href|<image|foreignObject/i.test(v)){
      if(!/xmlns=/.test(v))v=v.replace('<svg','<svg xmlns="http://www.w3.org/2000/svg"');c.img=v.trim();c.iv=ILLV;c.u=Date.now();save();vocab();editImg(i)}
    else m.textContent='The generated image was invalid, please try again.'}
  catch(e){m.textContent=e&&e.code=='rate_limited'?'Rate limited, try again in a few minutes.':e&&e.code=='not_granted'?'Permission was declined.':'Something went wrong, please try again.'}}

/* ---------- Cloud sync outside Claude: a private GitHub Gist ---------- */
const GHF='russian-memorise-sync.json',GHD='Russian MemoRise sync (do not edit)';
const ghTok=()=>{try{return localStorage.getItem('ghTok')||''}catch(e){return''}},ghGid=()=>{try{return localStorage.getItem('ghGist')||''}catch(e){return''}};
async function ghApi(tok,path,method,body){const r=await fetch('https://api.github.com'+path,{method:method||'GET',cache:'no-store',headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});
  if(!r.ok){const e=new Error('GitHub '+r.status);e.status=r.status;throw e}return r.status==204?null:r.json()}
async function ghFind(tok){for(let p=1;p<=5;p++){const l=await ghApi(tok,'/gists?per_page=100&page='+p);const g=l.find(x=>x.files&&x.files[GHF]);if(g)return g.id;if(l.length<100)break}
  const g=await ghApi(tok,'/gists','POST',{description:GHD,public:false,files:{[GHF]:{content:'{}'}}});return g.id}
async function ghRead(tok,id){const g=await ghApi(tok,'/gists/'+id),f=g.files&&g.files[GHF];if(!f)return{};
  let t=f.content;if(f.truncated){const r=await fetch(f.raw_url,{cache:'no-store'});if(!r.ok)throw new Error('raw');t=await r.text()}
  try{return JSON.parse(t||'{}')||{}}catch(e){return{}}}
function mkGistDB(tok,id){let pend={};return{
  collection:()=>({limit:()=>({get:async()=>{const m=await ghRead(tok,id);return{docs:Object.keys(m).map(k=>({id:k,data:()=>m[k]}))}}}),doc:k=>({set:async d=>{pend[k]=d}})}),
  flush:async()=>{const ks=Object.keys(pend);if(!ks.length)return;const m=await ghRead(tok,id);
    ks.forEach(k=>{const n=pend[k],o=m[k];if(!o||!((o.u||0)>(n.u||0)))m[k]=n});
    await ghApi(tok,'/gists/'+id,'PATCH',{files:{[GHF]:{content:JSON.stringify(m)}}});pend={}}}}
function syncView(){VIEW='menu';TAB='settings';const on=!!(ghTok()&&ghGid());$.innerHTML=`<h1>☁️ Sync between devices</h1>
  <div class="card">${on?`<b>Connected ✔</b><div class="mu" style="margin:4px 0 8px">Your words, sentences and progress are saved to a private Gist in your GitHub account and kept the same on every device that uses the same key.</div><div class="mu sy" style="margin-bottom:10px">${syLine()}</div><div class="row"><button class="p" onclick="sync()">Sync now</button><button onclick="ghOff()">Disconnect this device</button></div>`
  :`<b>Connect with a GitHub key</b><div class="mu" style="margin:4px 0 8px">Use the <b>same key</b> on your phone and your computer. Your data is saved to a private Gist in your GitHub account. Connect the device that already has your data first.</div>
  <input id="gk" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste your key (ghp_…)"><div class="row" style="margin-top:8px"><button class="p" onclick="ghConnect()">Connect</button></div>`}
  <div id="gm" class="mu" style="margin-top:8px;min-height:22px"></div></div>
  ${on?'':`<div class="card mu"><b>How to get a key</b><br>1. On github.com open Settings → Developer settings → Personal access tokens → Tokens (classic).<br>2. Generate new token (classic). Note: “MemoRise sync”. Expiration: No expiration.<br>3. Tick only <b>gist</b>, then Generate token and copy it.<br>Keep it private: anyone with the key can read your Gists.</div>`}
  <button class="w" onclick="home()">← Home</button>`}
async function ghConnect(){const m=document.getElementById('gm'),t=(document.getElementById('gk').value||'').trim();if(!t){m.textContent='Paste your key first.';return}
  m.textContent='Connecting…';try{const id=await ghFind(t);try{localStorage.setItem('ghTok',t);localStorage.setItem('ghGist',id)}catch(e){}DB=mkGistDB(t,id);UID='gh';await sync();syncView()}
  catch(e){m.textContent=e&&e.status==401?'This key is not valid. Check that you copied all of it.':e&&(e.status==403||e.status==404)?'This key cannot use Gists. Create it with the “gist” box ticked.':'Could not connect. Check your internet and try again.'}}
function ghOff(){try{localStorage.removeItem('ghTok');localStorage.removeItem('ghGist')}catch(e){}DB=null;syncMsg='☁️ Sync off (data is stored on this device only)';syncView()}
async function initSync(){
  try{if(typeof claude!='undefined'){const[d,u]=await Promise.all([claude.use('db'),claude.use('user')]);if(d&&u){UID=await u.id();if(UID)DB=d}}}catch(e){}
  if(!DB){const t=ghTok(),g=ghGid();if(t&&g){DB=mkGistDB(t,g);UID='gh'}}
  if(!DB){syncMsg='☁️ Sync off (data is stored on this device only)';paintSync();return}
  sync()}
async function sync(){
  if(!DB||syncing)return;if(VIEW=='game'){schedSync();return}
 syncing=true;syncMsg='☁️ Syncing…';paintSync();let changed=false;
  try{
    const col=DB.collection('data/users/'+UID),snap=await col.limit(1000).get(),rem={};let meta=null;
    const remS={};snap.docs.forEach(d=>{const x=d.data();if(!x)return;if(d.id=='meta')meta=x;else if(x.t=='s'&&x.k)remS[x.k]=x;else if(x.k)rem[x.k]=x});
    const loc={};S.cards.forEach(c=>loc[c.k]=c);const byRu={};S.cards.forEach(c=>byRu[norm(c.ru)]=c.k);
    for(const k in rem){const r=rem[k],l=loc[k],dk=S.dead[k]||0;
      if(r.del){if(l&&l.u<=r.u){delete loc[k];changed=true}S.dead[k]=Math.max(dk,r.u)}
      else if(dk>=r.u){}
      else if(!l){const dup=byRu[norm(r.ru)];if(dup&&dup!=k)delete loc[dup];loc[k]=JSON.parse(JSON.stringify(r));delete S.dead[k];changed=true}
      else if(r.u>l.u){Object.keys(l).forEach(x=>delete l[x]);Object.assign(l,JSON.parse(JSON.stringify(r)));changed=true}}
    S.cards=Object.values(loc);S.cards.forEach(fix);if(applyIll())changed=true;if(fixForms())changed=true;
    const ls={};S.sents.forEach(x=>ls[x.k]=x);
    for(const k in remS){const r=remS[k],l=ls[k],dk=S.sdead[k]||0;
      if(r.del){if(l&&l.u<=r.u){delete ls[k];changed=true}S.sdead[k]=Math.max(dk,r.u)}
      else if(dk>=r.u){}
      else if(!l){ls[k]=JSON.parse(JSON.stringify(r));delete S.sdead[k];changed=true}
      else if(r.u>l.u){Object.keys(l).forEach(x=>delete l[x]);Object.assign(l,JSON.parse(JSON.stringify(r)));changed=true}}
    S.sents=Object.values(ls);
    const w=[];S.cards.forEach(c=>{const r=rem[c.k];if(!r||c.u>r.u)w.push(['c_'+c.k,c])});
    for(const k in S.dead){const r=rem[k];if(!r||(!r.del&&S.dead[k]>=r.u))w.push(['c_'+k,{k,del:1,u:S.dead[k]}])}
    S.sents.forEach(x=>{const r=remS[x.k];if(!r||x.u>r.u)w.push(['s_'+x.k,Object.assign({t:'s'},x)])});
    for(const k in S.sdead){const r=remS[k];if(!r||(!r.del&&S.sdead[k]>=r.u))w.push(['s_'+k,{t:'s',k,del:1,u:S.sdead[k]}])}
    if(meta){const nx=Math.max(S.xp||0,meta.xp||0),pd=x=>x?Date.parse(x)||0:0,ml=pd(meta.last),sl=pd(S.last);let ns=S.streak||0,nl=S.last;
      if(ml>sl||(ml==sl&&(meta.streak||0)>ns)){ns=meta.streak||0;nl=meta.last}
      if(nx!=S.xp||ns!=S.streak||nl!=S.last){S.xp=nx;S.streak=ns;S.last=nl;changed=true}
      const mj=meta.jp||{},lj=S.jp||{},uj=Object.assign({},mj);Object.keys(lj).forEach(k=>{if(!(uj[k]>=lj[k]))uj[k]=lj[k]});
      if(Object.keys(uj).length!=Object.keys(lj).length){S.jp=uj;changed=true}
      if(nx!=meta.xp||ns!=meta.streak||nl!=meta.last||Object.keys(uj).length!=Object.keys(mj).length){S.mu=Date.now();w.push(['meta',{xp:nx,streak:ns,last:nl,u:S.mu,jp:uj}])}}
    else w.push(['meta',{xp:S.xp,streak:S.streak,last:S.last,u:S.mu||Date.now(),jp:S.jp||{}}]);
    save(1);let fail=false;
    for(const[id,data]of w){try{await col.doc(id).set(JSON.parse(JSON.stringify(data)))}catch(e){fail=true;if(e&&e.code=='resource_exhausted'||e&&e.code=='quota_exceeded')break}}
    if(DB.flush){try{await DB.flush()}catch(e){fail=true;if(e&&e.status==401)throw e}}
    const t=new Date();syncMsg=fail?'☁️ Sync incomplete, will retry later':`☁️ Synced at ${t.getHours()}:${String(t.getMinutes()).padStart(2,'0')}`;
  }catch(e){syncMsg=e&&e.status==401?'☁️ GitHub key not valid, open Sync settings':'☁️ Sync error, will retry later'}
  syncing=false;paintSync();
  if(changed){if(VIEW=='home')home();else if(VIEW=='vocab'){const t=document.getElementById('t'),ed=document.getElementById('ed');if(t&&!t.value&&ed&&!ed.innerHTML)vocab()}}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});

const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}},lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
function ruVoices(){try{return speechSynthesis.getVoices().filter(v=>v.lang&&/^ru/i.test(v.lang.replace('_','-')))}catch(e){return[]}}
const vScore=v=>{const n=v.name.toLowerCase();let x=0;if(/natural|neural|premium|enhanced|wavenet|studio|online/.test(n))x+=50;if(/google/.test(n))x+=20;if(/milena|yuri|katya|svetlana|dariya|pavel|irina|alena|artem|aleksandr/.test(n))x+=10;if(!v.localService)x+=5;return x};
function ruVoice(){const vs=ruVoices(),pick=lsGet('ruVoice');return vs.find(v=>v.name==pick)||vs.slice().sort((a,b)=>vScore(b)-vScore(a))[0]}
function speak(t){try{const u=new SpeechSynthesisUtterance(String(t).replace(/\u0301/g,''));u.lang='ru-RU';u.rate=+(lsGet('ruRate')||.95);const v=ruVoice();if(v)u.voice=v;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}

  S.xp+=q>=3?10:0;save()}

// Hidden metrics (never shown in games): memory_score 0-100, correct_count, wrong_count, last_reviewed, next_review(=due), recent (last 5 results)
function fix(c){if(c.pos==='')c.pos='-';if(c.set===undefined)c.set='Unit 3';if(c.memory_score===undefined){const r=c.reps||0;c.correct_count=r;c.wrong_count=c.lapses||0;
  c.memory_score=Math.min(100,r*25+(c.int>=21?15:0));c.last_reviewed=c.due>1?Math.max(0,c.due-(c.int||0)*DAY):0;c.recent=Array(Math.min(r,5)).fill(1)}}
const isNew=c=>c.reps==0&&!c.lapses&&c.due==0;
const isMastered=c=>{const r=c.recent||[];return r.length>=3&&r.slice(-3).every(x=>x==1)};
function pickQueue(pool,n=10){
  const now=Date.now(),COOL=10*6e4,nw=shuf(pool.filter(isNew));
  const due=pool.filter(c=>!isNew(c)&&c.due<=now&&(!c.last_reviewed||now-c.last_reviewed>COOL)).map(c=>{
    const over=Math.min(30,(now-c.due)/DAY*10),weak=(100-c.memory_score)*.3+Math.min(15,(c.recent||[]).filter(x=>!x).length*5);
    return[40+over+weak+Math.random()*8,c]}).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
  const quota=Math.min(nw.length,Math.max(n-due.length,Math.ceil(n*.3)));
  let q=due.slice(0,n-quota).concat(nw.slice(0,quota));
  if(q.length<n){const used=new Set(q);
    const rest=pool.filter(c=>!used.has(c)&&!isNew(c)).map(c=>[(100-c.memory_score)+(now-(c.last_reviewed||0))/DAY*5-(isMastered(c)?30:0)+Math.random()*10,c]).sort((a,b)=>b[0]-a[0]).map(x=>x[1]);
    q=q.concat(rest.slice(0,n-q.length))}
  return shuf(q)}
const dueCards=()=>S.cards.filter(c=>!isNew(c)&&c.due<=Date.now());
const stats=()=>({n:S.cards.filter(isNew).length,due:dueCards().length,m:S.cards.filter(isMastered).length});

function parse(txt,setName){let n=0;txt.split(/\r?\n/).forEach(l=>{l=l.trim();if(!l)return;
  let p=l.includes('\t')?l.split('\t'):l.includes(';')?l.split(';'):l.includes('|')?l.split('|'):l.includes(' - ')?l.split(' - '):l.split(',');
  if(p.length<2)return;const ru=p[0].trim(),en=p.slice(1).join(',').trim();
  if(!ru||!en||S.cards.some(c=>norm(c.ru)==norm(ru)))return;
  S.cards.push({k:mk(),u:Date.now(),ru,en,ef:2.5,int:0,reps:0,due:0,lapses:0,memory_score:0,correct_count:0,wrong_count:0,last_reviewed:0,recent:[],set:setName||''});n++});save();return n}

function home(){VIEW='home';const s=stats(),lv=Math.floor(S.xp/400)+1;let b='';
const pill=`<span class="pill" style="background:color-mix(in srgb,var(--bad) 16%,var(--card));color:var(--bad)">${ico(IC.flame)}${S.streak}</span>`;
if(TAB=='journey'){b=jHtml()}
else if(TAB=='games'){b=gamesHtml()}
else if(TAB=='settings'){b=setHtml()}
 else if(TAB=='buddy'){b=bdHtml()}
else{const J=jBuild(),nd=J.cur>=0?J.flat[J.cur]:null;if(nd)JMAP[nd.id]=nd;
 const sub=!nd?'':nd.t=='g'?nd.w.length+' words · '+esc(nd.w.slice(0,3).map(c=>c.ru).join(', '))+(nd.w.length>3?'…':''):nd.t=='r'?esc(UNITS[nd.u].t):nd.w.length+' words · pass with over 70%';
 const dn=J.flat.filter(x=>x.done).length;
 b=`<div class="hd"><div style="flex:1"><h1>Russian MemoRise</h1><div class="tg">Learn Russian. One step at a time.</div></div>${pill}</div>
<img class="hero" alt="" src="${IMG_BEAR}">
<div class="card" style="display:flex;align-items:center;gap:12px"><div class="lv">Lv.${lv}</div><div style="flex:1"><b>Your Russian journey</b><div class="bar" style="margin:6px 0 4px"><i style="width:${Math.round((S.xp%400)/4)}%"></i></div><div class="mu" style="font-size:13px">${S.xp%400} / 400 XP to Lv.${lv+1}</div></div></div>
<div class="chips"><div class="chip2" style="background:color-mix(in srgb,#238CF4 18%,var(--card))">${S.cards.length}<span>words</span></div><div class="chip2" style="background:color-mix(in srgb,#FFD86B 32%,var(--card))">${s.n}<span>new</span></div><div class="chip2" style="background:color-mix(in srgb,#FF454D 15%,var(--card))">${s.due}<span>to review</span></div><div class="chip2" style="background:color-mix(in srgb,#6EE7B7 32%,var(--card))">${s.m}<span>mastered</span></div></div>
${nd?`<div class="card" style="margin-top:12px"><div class="mu" style="font-size:13px">Next lesson</div><b style="font-size:19px">${jTitle(nd)}</b><div class="mu" style="margin:2px 0 4px">${sub}</div><div class="mu" style="font-size:13px;margin-bottom:10px">${dn}/${J.flat.length} journey steps done</div><button class="p w" style="text-align:center;margin:0" onclick="jGo('${nd.id}')">${S.jr&&S.jr.id==nd.id?'Resume':'Start learning'} →</button></div>`:''}`}

let SETF='__all';
const setNames=()=>[...new Set(S.cards.map(c=>c.set||'').filter(Boolean))].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
function paintList(){const vl=document.getElementById('vl');if(!vl)return;
  const names=setNames(),noSet=S.cards.filter(c=>!c.set).length;
  if(SETF==='')SETF=noSet?'':'__all';else if(SETF!=='__all'&&!names.includes(SETF))SETF='__all';
  const opt=(v,l)=>`<option value="${esc(v)}"${v===SETF?' selected':''}>${esc(l)}</option>`;
  document.getElementById('sf').innerHTML=opt('__all',`All sets (${S.cards.length})`)+names.map(n=>opt(n,`${n} (${S.cards.filter(c=>c.set===n).length})`)).join('')+(noSet?opt('',`No set (${noSet})`):'');
  const rows=S.cards.map((c,i)=>[c,i]).filter(([c])=>SETF==='__all'||(c.set||'')===SETF);
  document.getElementById('vc').textContent=`${rows.length} words`;
  vl.innerHTML=rows.map(([c,i])=>`<div><span style="display:flex;align-items:center;gap:8px">${thumb(c,28)}<span>${esc(c.ru)} – ${esc(c.en)}</span></span><span style="display:flex;align-items:center;gap:8px;white-space:nowrap"><span class="tag">${esc(c.set||'No set')}</span><a href="#" onclick="editImg(${i});return false">✏️ edit</a> · <a href="#" onclick="del(${i});return false">delete</a></span></div>`).join('')}
function saveSet(i){const c=S.cards[i];c.set=document.getElementById('es').value.trim();c.u=Date.now();save();vocab();editImg(i)}
const needGram=c=>c.pos===undefined||(['Он','Она','Оно'].includes(c.pos)&&c.fv!==2);
function saveGram(i){const c=S.cards[i];c.pos=document.getElementById('egp').value;c.form=document.getElementById('egf').value.trim();c.fv=2;c.u=Date.now();save();vocab();editImg(i)}
async function genGram(){const m=document.getElementById('dm'),btn=document.getElementById('gg');let sample=null;try{sample=await claude.use('sample')}catch(e){}
  if(!sample){m.textContent='AI filling is not available in this view.';return}
  const todo=S.cards.filter(needGram);btn.disabled=true;let done=0;
  try{for(let i=0;i<todo.length;i+=8){const bt=todo.slice(i,i+8);m.textContent=`Analyzing… ${done}/${todo.length}`;
    const r=await sample.json(`For each Russian entry below give "pos" and "form". pos = "V" if it is a verb; "Он", "Она" or "Оно" if it is a noun, according to its grammatical gender; "-" for anything else (adjectives, adverbs, pronouns, numerals, prepositions, particles, interjections, multi-word phrases). form = for a verb: the six present-tense forms (я, ты, он/она, мы, вы, они) written in that order, separated by "; ", WITHOUT pronouns, e.g. "говорю; говоришь; говорит; говорим; говорите; говорят" (if the verb is perfective and has no present tense, give its simple future forms in the same way); for a noun: ALL 12 forms in exactly this order, separated by "; ": singular nominative; genitive; dative; accusative; instrumental; prepositional; then plural nominative; genitive; dative; accusative; instrumental; prepositional (keep every position even if two forms are identical, write "-" for a position that does not exist, e.g. no singular or no plural; use the correct animate/inanimate accusative); for everything else: "". Use the English meaning to pick the right word. Return ONLY a JSON array like [{"i":0,"pos":"V","form":"..."}]. Entries: ${JSON.stringify(bt.map((c,k)=>({i:k,ru:c.ru,en:c.en})))}`,{cache:false});
    const arr=Array.isArray(r)?r:(r&&r.items)||[];
    arr.forEach(o=>{const c=bt[o&&o.i];if(!c)return;const pos=['V','Он','Она','Оно'].includes(o.pos)?o.pos:'-';c.pos=pos;c.form=pos!='-'&&typeof o.form=='string'?o.form.trim():'';c.fv=2;c.u=Date.now();done++});
    save()}
    m.textContent=`Done! Filled in ${done} words.`}
  catch(e){m.textContent=(e&&e.code=='rate_limited'?'Rate limited, try again in a few minutes. ':e&&e.code=='not_granted'?'Permission was declined. ':'Something went wrong. ')+`Filled in ${done} words.`}
  setTimeout(dataView,1200)}
function imp(){const sn=document.getElementById('sn').value.trim(),n=parse(document.getElementById('t').value,sn);document.getElementById('m').textContent=`Added ${n} new words${sn?' to "'+sn+'"':''}.`;setTimeout(vocab,700)}
function fl(i){const f=i.files[0];if(!f)return;f.text().then(t=>{document.getElementById('t').value=t})}
function del(i){S.dead[S.cards[i].k]=Date.now();S.cards.splice(i,1);save();vocab()}

/* ---------- Game engine ---------- */
let G=null;
function start(mode,sub){
  let pool=sub=='wi'?S.cards.filter(c=>c.img):S.cards;
  if(mode=='puzzle'){const p2=pool.filter(c=>[...c.ru.replace(/\s/g,'')].length>=3);if(p2.length)pool=p2}
  if((mode=='choice'||mode=='listen'||mode=='match')&&pool.length<2){alert(sub=='wi'?'You need at least 2 words with images. Generate images under Add / manage vocabulary.':'You need at least 2 words for this game.');return}
  VIEW='game';
  let q=pickQueue(pool,(mode=='type'||mode=='typing'||mode=='puzzle')?8:mode=='match'?12:10);if(!q.length)q=shuf(pool).slice(0,10);
  G={mode,sub,q,total:q.length,done:0,ok:0,retry:new Set(),rt:{}};touchStreak();next()}
function next(){
  if(G.mode=='jny')return jNext();
  if(G.mode=='learn')return learnNext();
  if(G.mode=='puzzle')return pzNext();
  if(G.mode=='typing')return tpNext();
  if(G.mode=='gram')return gramNext();
  if(G.mode=='efix')return efNext();
  if(G.mode=='trans')return trNext();
  if(G.mode=='sbuild')return sbNext();
  if(G.mode=='sfill')return sfNext();
  if(!G.q.length)return end();
  const c=G.q[0];G.c=c;G.ans=false;
  const pct=Math.round(G.done/G.total*100);
  const head=`<div class="row" style="justify-content:space-between"><button onclick="home()">✕</button><span class="mu">⭐ ${S.xp}</span></div><div class="bar"><i style="width:${pct}%"></i></div>`;
  const spk=`<div style="text-align:center"><button onclick="speak(G.c.ru)"><span class="ico">${SPK}</span> Listen</button></div>`;
  if(G.mode=='flash'){
    $.innerHTML=head+`<div class="sub">Tap to flip · Swipe left: not yet · Swipe right: got it</div>
    <div class="sw"><div class="fc" id="fc"><div id="hl"></div><div class="fi" id="fi">
    <div class="fs">${imgHtml(c,100)}<div class="big" style="margin:0">${esc(c.ru)}</div><button onclick="speak(G.c.ru)"><span class="ico">${SPK}</span> Listen</button></div>
    <div class="fs bk">${imgHtml(c,100)}<div class="big" style="font-size:26px;margin:0">${esc(c.en)}</div><div class="mu">${esc(c.ru)}</div></div></div></div></div>
    <div class="row"><button style="flex:1" onclick="swipe(-1)">✗ Not yet</button><button class="p" style="flex:1" onclick="swipe(1)">✓ Got it</button></div>`;bindSwipe();speak(c.ru)}
  else if(G.mode=='match'){
    const n=G.q.length<=6?G.q.length:(G.q.length-6==1?5:6);G.B=G.q.slice(0,n);G.L=shuf(G.B.map((_,i)=>i));G.R=shuf(G.B.map((_,i)=>i));G.sel=null;G.miss=new Set();G.m=0;G.lock=false;
    let t=G.sub;if(!t||t=='mix'){const o=['wm','am'];if(G.B.every(c=>c.img))o.push('wi');t=o[Math.floor(Math.random()*o.length)]}
    G.t=t;const hint={wm:'Tap a Russian word, then tap its English meaning',wi:'Tap a Russian word, then tap its matching image',am:'Listen to the audio, then tap the English meaning'}[t];
    $.innerHTML=head+`<div class="sub" style="margin-bottom:10px">${hint}</div>${mgGrid(G.L.map((i,k)=>`<button id="l${i}" onclick="mt('l',${i})">${t=='am'?`<span class="ico">${SPK}</span> ${k+1}`:esc(G.B[i].ru)}</button>`),G.R.map(i=>`<button id="r${i}" onclick="mt('r',${i})">${t=='wi'?imgHtml(G.B[i],56)+'<div style="font-size:13px;line-height:1.2;margin-top:3px">'+esc(G.B[i].en)+'</div>':esc(G.B[i].en)}</button>`),t=='wi'?100:66)}`}
  else if(G.mode=='choice'||G.mode=='listen'){
    const d=G.mode=='choice'?(G.sub=='er'?'er':G.sub=='mix'?(Math.random()<.5?'er':'re'):'re'):'re';G.d=d;
    const f=d=='er'?'ru':'en',ans=c[f];
    const others=shuf([...new Set(S.cards.filter(x=>norm(x[f])!=norm(ans)).map(x=>x[f]))]).slice(0,3);
    const opts=shuf([ans,...others]);G.opts=opts;G.key=ans;
    const qh=G.mode=='listen'?`<div class="big">🎧 ?</div><div class="sub">Listen and pick the correct meaning</div>${spk}`
      :d=='er'?`<div class="sub">Translate to Russian:</div><div class="big" style="margin:10px 0">${esc(c.en)}</div>`
      :`<div class="sub">Translate to English:</div><div class="big" style="margin:10px 0">${esc(c.ru)}</div>${spk}`;
    $.innerHTML=head+`<div class="card">${qh}<div style="margin-top:16px">${opts.map((o,i)=>`<button class="w"${d=='er'?' style="font-size:22px;font-weight:700"':''} onclick="pick(${i})">${esc(o)}</button>`).join('')}</div><div id="fb"></div></div>`;if(d=='re')speak(c.ru)}
  else{
    $.innerHTML=head+`<div class="card">${imgHtml(c,90)}<div class="sub">Type it in Russian:</div><div class="big" style="font-size:26px">${esc(c.en)}</div><div id="sl" onclick="document.getElementById('i').focus()" style="text-align:center;font-size:32px;font-weight:700;letter-spacing:.14em;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);min-height:64px;line-height:1.4;word-break:break-all"></div><input id="i" inputmode="none" autocomplete="off" autocapitalize="none" spellcheck="false" oninput="slots()" onkeydown="if(event.key=='Enter')chk()" style="position:fixed;top:0;left:0;opacity:0;width:1px;height:1px;border:0;padding:0">
    <div class="kb" style="margin-top:8px">${KB()}</div>
    <div id="fb"></div><button class="p w" style="text-align:center;margin-top:10px" id="go" onclick="chk()">Check</button></div>`;slots();document.getElementById('i').focus()}}
function mt(s,i){if(G.lock)return;const b=document.getElementById(s+i);if(b.disabled)return;
  if(s=='l')speak(G.B[i].ru);
  if(!G.sel||G.sel.s==s){if(G.sel)document.getElementById(G.sel.s+G.sel.i).classList.remove('sel');G.sel={s,i};b.classList.add('sel');return}
  const a=G.sel;G.sel=null;const l=s=='l'?i:a.i,r=s=='r'?i:a.i,bl=document.getElementById('l'+l),br=document.getElementById('r'+r);
  bl.classList.remove('sel');br.classList.remove('sel');
  if(l==r){[bl,br].forEach(x=>{x.classList.add('ok');x.disabled=true});if(G.t=='am')bl.textContent=G.B[l].ru;if(++G.m==G.B.length)finishBoard()}
  else{G.miss.add(l);G.miss.add(r);G.lock=true;[bl,br].forEach(x=>x.classList.add('no'));setTimeout(()=>{[bl,br].forEach(x=>x.classList.remove('no'));G.lock=false},600)}}
/* ---------- Learning data (read-only) ---------- */
let DV={k:'memory_score',d:1},DVS='__all';
const stOf=c=>isNew(c)?'New':isMastered(c)?'Mastered':c.due<=Date.now()?'Due':'Learning';
const rel=(t,fut)=>{if(!t)return'—';const d=fut?t-Date.now():Date.now()-t,a=Math.abs(d)/6e4,h=a/60,dd=h/24,u=dd>=1?Math.round(dd)+'d':h>=1?Math.round(h)+'h':Math.max(1,Math.round(a))+'m';return fut?(d<=0?u+' overdue':'in '+u):u+' ago'};
const iso=t=>t?new Date(t).toISOString():'';
const COLS=[['ru','Word',c=>c.ru,c=>`<b>${esc(c.ru)}</b>`],['en','English',c=>c.en,c=>esc(c.en)],['pos','Part of Speech',c=>c.pos||'',c=>esc(c.pos||'')],['form','Form',c=>c.form||'',c=>esc(c.form||'')],['set','Set',c=>c.set||'',c=>esc(c.set||'—')],
 ['memory_score','Score',c=>c.memory_score||0,c=>c.memory_score||0],['correct_count','Correct',c=>c.correct_count||0,c=>c.correct_count||0],['wrong_count','Wrong',c=>c.wrong_count||0,c=>c.wrong_count||0],
 ['reps','Streak',c=>c.reps||0,c=>c.reps||0],['int','Interval (days)',c=>c.int||0,c=>c.int||0],['ef','Ease',c=>c.ef||0,c=>(+c.ef||0).toFixed(2)],['lapses','Lapses',c=>c.lapses||0,c=>c.lapses||0],
 ['last_reviewed','Last review',c=>c.last_reviewed||0,c=>rel(c.last_reviewed,false)],['due','Next review',c=>isNew(c)?1e15:c.due,c=>isNew(c)?'—':rel(c.due,true)],
 ['status','Status',c=>stOf(c),c=>stOf(c)],['recent','Last 5',c=>(c.recent||[]).join(''),c=>(c.recent||[]).map(x=>x?'✓':'✗').join(' ')||'—']];
function dvSort(k){DV=DV.k==k?{k,d:-DV.d}:{k,d:k=='ru'||k=='en'||k=='set'||k=='status'?1:-1};dataView()}
function dataView(){VIEW='menu';const col=COLS.find(x=>x[0]==DV.k)||COLS[3],cs=S.cards.filter(c=>DVS==='__all'||(c.set||'')===DVS);
  const rows=cs.slice().sort((a,b)=>{const x=col[2](a),y=col[2](b);return(typeof x=='number'?x-y:String(x).localeCompare(String(y)))*DV.d});
  const n=x=>cs.filter(c=>stOf(c)==x).length,avg=cs.length?Math.round(cs.reduce((a,c)=>a+(c.memory_score||0),0)/cs.length):0;
  $.innerHTML=`<h1>📊 Learning data</h1>
  <div class="card"><div class="row" style="align-items:center;justify-content:space-between;flex-wrap:nowrap"><b>${cs.length} words</b><select onchange="DVS=this.value;dataView()"><option value="__all">All sets</option>${setNames().map(x=>`<option value="${esc(x)}"${x===DVS?' selected':''}>${esc(x)}</option>`).join('')}</select></div>
  <div class="mu" style="margin-top:6px">New ${n('New')} · Learning ${n('Learning')} · Due ${n('Due')} · Mastered ${n('Mastered')} · Avg score ${avg}</div></div>
  <div class="dtw"><table class="dt"><thead><tr>${COLS.map(x=>`<th onclick="dvSort('${x[0]}')">${x[1]}${x[0]==DV.k?(DV.d>0?' ▲':' ▼'):''}</th>`).join('')}</tr></thead><tbody>${rows.map(c=>`<tr>${COLS.map(x=>`<td>${x[3](c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <div class="mu" style="margin:8px 2px">Tap a column title to sort. Score = memory (0–100) · Streak = correct answers in a row · Mastered = last 3 answers correct.</div>
  <div class="card"><b>Adjust score</b><div class="mu" style="margin:4px 0 8px">Adds points to every word in the set chosen in the filter above (result stays between 0 and 100). Use a negative number to subtract.</div>
  <div class="row" style="flex-wrap:nowrap;align-items:center"><input id="dvn" type="number" value="5" style="width:90px"><button class="p" id="dvb" style="flex:1" onclick="dvBump()"${DVS==='__all'?' disabled':''}>${DVS==='__all'?'Choose a set above first':'Apply to '+esc(DVS||'No set')+' ('+cs.length+' words)'}</button></div></div>
  <div class="card"><b>Part of Speech &amp; Form</b><div class="mu" style="margin:4px 0 8px">Claude fills in Part of Speech (V, Он, Она, Оно) and Form (verb: 6 present forms; noun: 12 forms = 6 cases singular + 6 cases plural) for words that don't have them yet, and updates older noun entries to the full set of forms. Fix any word with ✏️ edit in the vocabulary list.</div>
  <button class="p w" style="text-align:center" id="gg" onclick="genGram()"${!S.cards.some(needGram)?' disabled':''}>${!S.cards.some(needGram)?'All words are filled in':'Fill in '+S.cards.filter(needGram).length+' words'}</button></div>
  <div id="dm" class="mu" style="min-height:22px"></div>
  <button class="w p" style="text-align:center" onclick="dvDownload()">⬇ Download CSV</button><button class="w" style="text-align:center" onclick="vocab()">← Back</button>`}
let dvc=0;
function dvBump(){const b=document.getElementById('dvb'),lab=b.textContent;
  if(!dvc){dvc=1;b.textContent='Tap again to confirm';setTimeout(()=>{dvc=0;const x=document.getElementById('dvb');if(x&&x.textContent=='Tap again to confirm')x.textContent=lab},4000);return}
  dvc=0;const n=parseInt(document.getElementById('dvn').value,10)||0,t=Date.now();let k=0;
  S.cards.forEach(c=>{if(DVS!=='__all'&&(c.set||'')===DVS){c.memory_score=Math.max(0,Math.min(100,(c.memory_score||0)+n));c.u=t;k++}});
  save();dataView();document.getElementById('dm').textContent=`${n>=0?'Added':'Subtracted'} ${Math.abs(n)} ${n>=0?'to':'from'} the score of ${k} words in "${DVS||'No set'}".`}
function dvCsv(){const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"',H=['word','english','part_of_speech','form','set','memory_score','correct_count','wrong_count','streak_reps','interval_days','ease','lapses','last_reviewed','next_review','status','recent_results'];
  return [H.join(',')].concat(S.cards.map(c=>[c.ru,c.en,c.pos||'',c.form||'',c.set||'',c.memory_score||0,c.correct_count||0,c.wrong_count||0,c.reps||0,c.int||0,(+c.ef||0).toFixed(2),c.lapses||0,iso(c.last_reviewed),isNew(c)?'':iso(c.due),stOf(c),(c.recent||[]).join('')].map(q).join(','))).join('\n')}
async function dvDownload(){const m=document.getElementById('dm'),csv='\ufeff'+dvCsv();let d=null;try{if(typeof claude!='undefined')d=await claude.use('downloads')}catch(e){}
  if(d){try{await d.save({filename:'russian-memorise-data.csv',data:new Blob([csv],{type:'text/csv'})});m.textContent='Saved ✔'}catch(e){m.textContent=e&&e.code=='declined'?'Download cancelled.':'Could not save the file here.'}return}
  try{await navigator.clipboard.writeText(csv);m.textContent='Downloads are not available here – the CSV was copied to your clipboard instead.'}catch(e){m.textContent='Downloads are not available in this view.'}}
/* ---------- Typing (fill in the missing letters) ---------- */
function tpNext(){if(!G.q.length)return end();const c=G.q[0],pct=Math.round(G.done/G.total*100);
  tpView(`<div class="row" style="justify-content:space-between"><button onclick="home()">✕</button><span class="mu">⭐ ${S.xp}</span></div><div class="bar"><i style="width:${pct}%"></i></div>`,c)}
function tpView(head,c){G.c=c;G.ans=false;
  const ch=[...c.ru],idx=ch.map((x,i)=>/\s/.test(x)?-1:i).filter(i=>i>=0),k=Math.max(1,Math.floor(idx.length/2));
  G.T={ch,blanks:shuf(idx).slice(0,k).sort((a,b)=>a-b),vals:{}};
  $.innerHTML=head+`<div class="card" style="text-align:center">${imgHtml(c,90)}<div class="sub">Fill in the missing letters:</div><div class="big" style="font-size:26px;margin:6px 0 12px">${esc(c.en)}</div>
  <div id="tw" style="font-size:34px;font-weight:700;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);min-height:64px;line-height:1.5"></div>
  <div id="tk" class="kb" style="margin-top:12px">${KB('tk',false)}</div><div id="fb"></div>
  <button class="p w" id="go" style="text-align:center;margin-top:10px" onclick="tpCheck()">Check</button></div>`;tpRender()}
function tpRender(){const T=G.T,cur=T.blanks.find(i=>T.vals[i]===undefined);
  document.getElementById('tw').innerHTML=T.ch.map((x,i)=>/\s/.test(x)?'<span style="display:inline-block;width:.6em"></span>':T.blanks.includes(i)?`<span onclick="tpClear(${i})" style="display:inline-block;min-width:1.05em;margin:0 2px;border-bottom:3px solid ${i===cur?'var(--pr)':'var(--bd)'}">${T.vals[i]?esc(T.vals[i]):'&nbsp;'}</span>`:`<span style="display:inline-block;margin:0 2px;color:var(--mu)">${esc(x)}</span>`).join('')}
function tk(l){if(G.ans)return;const T=G.T;
  if(l===''){const f=T.blanks.filter(i=>T.vals[i]!==undefined);if(f.length)delete T.vals[f[f.length-1]]}

()=>`<h2>Why do Russian endings change? 🎭</h2><p>In English only a few words change with their job: <i>I – me – my</i>. In Russian <b>every noun</b> changes its <b>ending</b> to show its job in the sentence. These forms are called <b>cases</b>, and there are six:</p>
<table class="gt"><tr><th>Case</th><th>Question</th><th>Typical job</th></tr>${cases6.map(c=>`<tr${c[0]=='2'?' style="background:color-mix(in srgb,var(--pr) 18%,transparent)"':''}><td><b>${c[0]}. ${c[1]}</b><br><span class="mu">${c[2]}</span></td><td>${sp(c[3])}</td><td>${c[4]}<br>${sp(c[5])}</td></tr>`).join('')}</table>
<p>Today we study the <b>2nd case – the Genitive</b> (Родительный падеж, Р.п.). Good news: you already used it in Unit 3.3 (<b>две газеты</b>) and in <b>У меня</b>!</p>`,
()=>`<h2>Meet the Genitive: the “of” case 🏷️</h2><p>The Genitive answers <b>кого? чего?</b> – <i>of whom? of what?</i> It is the case of <b>belonging</b>:</p>
<div class="gex" style="text-align:center;font-size:22px">${sp('Это машина')} ${ul('Андрея')}.<div class="mu" style="font-size:16px">This is Andrey’s car = the car <i>of</i> Andrey</div></div>
<p>See the trick? The <b>owner</b> changes its ending: <b>Андрей → Андрея</b>. The owned thing (машина) stays as it is.</p>
<p>More examples – tap to hear:</p><table class="gt"><tr><td>${sp('книга сестры')}</td><td>the sister’s book</td></tr><tr><td>${sp('дом брата')}</td><td>the brother’s house</td></tr><tr><td>${sp('телефон мамы')}</td><td>Mom’s phone</td></tr></table>
<p class="mu">Think: <b>thing + owner(genitive)</b>. In Russian there is no ’s, the owner’s ending does the job!</p>`,
()=>`<h2>4 jobs of the Genitive 🛠️</h2>
<div class="gex">1️⃣ <b>Owner – “of / ’s”</b><br>${sp('дом брата')} <span class="mu">the brother’s house</span></div>
<div class="gex">2️⃣ <b>After У – “has”</b><br>${sp('У брата есть машина.')} <span class="mu">The brother has a car. (literally: “at the brother there is a car”)</span></div>

<div class="gex">4️⃣ <b>After 2, 3, 4</b><br>${sp('два брата')} · ${sp('две сестры')} <span class="mu">two brothers · two sisters</span></div>
<p class="mu">Later you will meet more: из (from), без (without), для (for), от, до…</p>`,
